# Project metadata
# Fill this in when starting a new project.

# ── LANGUAGE ──
# System instructions are in English; ALL generated output uses this language.
language: pt-BR          # pt-BR | en | es | fr | ...

title: "{Title}"
subtitle: ""
author: "{Your name}"

genre:
  primary: ""            # e.g. literary fantasy, speculative fiction
  secondary: ""
  audience: ""           # e.g. adult, YA

structure:
  unit: "chapter"        # chapter | part | section
  grouping: "act"        # act | part | none
  planned_total: 0
  interludes: 0

length:
  target_words: 0
  current_words: 0

paths:
  manuscript: "manuscript/"
  analyses: "manuscript/"          # or ".project/reports/technical/"
  naming: "{act}.{chapter}.md"
  # How chapter files are arranged. Declared, never detected — a wrong guess
  # produces a confident analysis of an incomplete book. See templates/layout.md.
  #   flat     manuscript/01.01.md        every chapter file in one directory
  #   chapter  manuscript/01.01/01.01.md  one directory per chapter, named the chapter id
  layout: "flat"                   # flat | chapter

status:
  phase: "draft"         # draft | revision | polish | submission
  chapters_written: 0
  chapters_revised: 0

ai:
  assisted: true
  declaration: "human curation item by item"
  # Density is measured in occurrences per 1,000 words (see templates/framework.md).
  # Per-category ceilings: framework defaults, overridable in config/style-guide.md.
  # Only the whole-chapter total lives here.
  density_ceiling_total: 8.0   # sum of all per-1k categories, revised chapter

dates:
  started: ""
  last_revision: ""
